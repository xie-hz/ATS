# coturn 配置示例
# 部署时把 <PUBLIC_IP> 换成服务器公网 IP，<REALM> 换成你的域名

listening-port=3478
listening-ip=0.0.0.0
external-ip=<PUBLIC_IP>
min-port=49152
max-port=65535
realm=<REALM>
server-name=easymeeting-turn
# 静态长期凭证（与 VITE_TURN_URL 中的 user/pass 一致）
user=easymeeting:easyturn2026
lt-cred-mech
fingerprint
no-cli
no-tls
no-dtls
logging=warning
