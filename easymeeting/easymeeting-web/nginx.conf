# EasyMeeting Web 客户端生产配置：
# 静态资源 + /api 反代到 Java HTTP(6060) + /ws 反代到 Netty WebSocket(6061)
# 与开发时 vite.config.js 的代理规则保持一致。

server {
  listen 80;
  server_name _;

  # 头像 / 聊天文件上传
  client_max_body_size 20m;

  # SPA 静态资源
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  # HTTP API -> Spring Boot (6060)
  location /api/ {
    proxy_pass http://easymeeting-java:6060/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket 信令 -> Netty (6061)，长连接 + 心跳需要放大超时
  location /ws {
    proxy_pass http://easymeeting-java:6061;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
